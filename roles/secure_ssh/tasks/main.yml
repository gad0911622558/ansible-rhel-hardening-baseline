---
# tasks file for roles/secure_ssh
- name: Open new SSH port (2222) in firewall first
  firewalld:
     port: "{{ ssh_port }}/tcp"
     permanent: true
     state: enabled
     immediate: true 
- name: Allow Selinux to accept SSh on the new port  
  community.general.seport:
    ports: "{{ ssh_port }}"
    proto: tcp
    setype: ssh_port_t
    state: present

- name: deploy hardened sshd_config
  template: 
     src: sshd_config.j2
     dest: /etc/ssh/sshd_config
     owner: root
     group: root
     mode: '0600'
     backup: yes
     validate: /usr/sbin/sshd -t -f %s
  notify: 
    # - Open new SSH port in firewall
     - Restart sshd
     - Close old SSH port in firewall
